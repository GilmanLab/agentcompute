version = 1

[provenance]
signer_workflow = "GilmanLab/agentcompute/.github/workflows/attest.yml"

[[packages]]
name = "agentcompute"
description = "agentcompute CodeMode MCP server."
tag_pattern = "v${version}"

[[packages.assets]]
os = "darwin"
arch = "amd64"
pattern = "agentcompute_${version}_darwin_amd64"

[[packages.assets]]
os = "darwin"
arch = "arm64"
pattern = "agentcompute_${version}_darwin_arm64"

[[packages.assets]]
os = "linux"
arch = "amd64"
pattern = "agentcompute_${version}_linux_amd64"

[[packages.assets]]
os = "linux"
arch = "arm64"
pattern = "agentcompute_${version}_linux_arm64"

[[packages.binaries]]
path = "agentcompute"
