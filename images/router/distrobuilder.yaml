    - /packages/bridge-1.5-r5.apk
    - /packages/busybox-1.37.0-r20.apk
    - /packages/busybox-binsh-1.37.0-r20.apk
    - /packages/busybox-openrc-1.37.0-r20.apk
    - /packages/c-ares-1.34.8-r0.apk
    - /packages/ca-certificates-bundle-20260611-r0.apk
    - /packages/dnsmasq-2.91-r1.apk
    - /packages/dnsmasq-common-2.91-r1.apk
    - /packages/dnsmasq-openrc-2.91-r1.apk
    - /packages/frr-10.2.2-r0.apk
    - /packages/frr-openrc-10.2.2-r0.apk
    - /packages/gmp-6.3.0-r3.apk
    - /packages/ifupdown-ng-0.12.1-r7.apk
    - /packages/ifupdown-ng-iproute2-0.12.1-r7.apk
    - /packages/ifupdown-ng-wireguard-0.12.1-r7.apk
    - /packages/ifupdown-ng-wireguard-quick-0.12.1-r7.apk
    - /packages/iproute2-6.15.0-r0.apk
    - /packages/iproute2-minimal-6.15.0-r0.apk
    - /packages/iproute2-ss-6.15.0-r0.apk
    - /packages/iproute2-tc-6.15.0-r0.apk
    - /packages/jansson-2.14.1-r0.apk
    - /packages/json-c-0.18-r1.apk
    - /packages/libapk2-2.14.10-r0.apk
    - /packages/libcap2-2.78-r0.apk
    - /packages/libcrypto3-3.5.8-r0.apk
    - /packages/libelf-0.193-r0.apk
    - /packages/libmnl-1.0.5-r2.apk
    - /packages/libncursesw-6.5_p20250503-r0.apk
    - /packages/libnftnl-1.2.9-r0.apk
