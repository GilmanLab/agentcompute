    - /packages/musl-utils-1.2.5-r12.apk
    - /packages/ncurses-terminfo-base-6.5_p20250503-r0.apk
    - /packages/nftables-1.1.3-r0.apk
    - /packages/nftables-openrc-1.1.3-r0.apk
    - /packages/openrc-0.62.6-r0.apk
    - /packages/openrc-user-0.62.6-r0.apk
