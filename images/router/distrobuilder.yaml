image:
  distribution: alpinelinux
  release: 3.22.5
  architecture: x86_64
  name: router
  description: Router system container (Alpine 3.22.5)
  variant: router
  serial: phase1
  expiry: 3650d
source:
  downloader: rootfs-http
  url: file:///build/seed.tar
packages:
  manager: apk
  update: false
  cleanup: true
  sets:
  - action: install
    flags:
    - --no-network
    packages:
    - /packages/alpine-baselayout-3.7.0-r0.apk
    - /packages/alpine-baselayout-data-3.7.0-r0.apk
    - /packages/alpine-keys-2.5-r0.apk
