; UltraVNC server configuration for the windows/11/desktop image.
;
; bootstrap.ps1 copies this next to winvnc.exe, so the server reads it from its
; own directory instead of the registry (UseRegistry=0).
;
; There is no baked VNC credential. AuthRequired=0 is the same posture the
; Linux desktop image uses for X0tigervnc: no reusable secret lives in a
; cluster-local image, and reachability is bounded by the sandbox network plus
; the inbound firewall rule bootstrap.ps1 installs (TCP 5900, LocalSubnet
; only). This is a fallback console for looking at pre-login and broken-session
; states, not the automation transport; the automation transport is the Cua
; Driver named pipe.
[ultravnc]
passwd=
passwd2=

[admin]
UseRegistry=0
; Fixed port, never auto-negotiated, so the server-side VNC endpoint is
; predictable for a forward.
AutoPortSelect=0
PortNumber=5900
; No HTTP/Java viewer surface and no second listener.
HttpPortNumber=0
HTTPConnect=0
; Accept viewer connections on the sandbox NIC; loopback-only would make the
; fallback useless, and LoopbackOnly=0 keeps that explicit.
AllowLoopback=0
LoopbackOnly=0
SocketConnect=1
; No authentication and no MS logon: the image carries no credential at all.
AuthRequired=0
MSLogonRequired=0
; Do not let a viewer change the server's configuration, shut the guest down,
; or transfer files. Read the screen, send input, nothing else.
AllowProperties=0
AllowShutdown=0
AllowEditClients=0
FileTransferEnabled=0
FTUserImpersonation=0
; Never prompt a local user to approve the connection: there is no human at
; this console.
QuerySetting=0
QueryTimeout=0
; Keep the session visually stable and cheap: no wallpaper removal surprises,
; no blanked monitor, no idle disconnect of a watching operator.
RemoveWallpaper=0
BlankMonitorEnabled=0
IdleTimeout=0
IdleInputTimeout=0
; A single tray-less boot service.
DisableTrayIcon=1
service_commandline=-service
