name: Windows Image Bake Dispatch

# Windows images are cluster-local Incus aliases. Nothing in this pipeline
# uploads a Windows artifact anywhere: no GHCR release, no
# actions/upload-artifact, no cache entry. Evaluation media grants test rights,
# not redistribution, so the media, the repacked installer and the captured
# image never leave the cluster and the repack host.
#
# The split mirrors images-publish.yml: this public workflow validates inputs
# that contain no media and no credentials, then dispatches the exact source
# commit to the private trigger repository, whose bake job runs on the
# agentcompute-publisher scale set. That job only calls the Incus API
# (images/windows/bake.py): Windows Setup runs on the cluster's first-level
# KVM, so the runner never needs nested virtualization and keeps
# security.nesting=false.
#
# Each <image>-installer ISO contains the answer file and guest payload.
# Root staging on sandbox01 imports it into image-build on the bake target.
# The publisher consumes those pre-staged volumes without downloading media.

on:
  push:
    branches: [master]
    paths:
      - images/windows/**
      - .github/workflows/windows-images.yml
  workflow_dispatch:
    inputs:
      image:
        description: Which Windows image to bake
        type: choice
        default: all
        options:
          - all
          - windows-11-desktop
          - windows-server-2025

permissions: {}

# Dispatch coalescing only; the private worker shares the image-bake lock with
# Linux publication and installs both Windows images serially for image=all.
concurrency:
  group: windows-image-bake
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.repository == 'GilmanLab/agentcompute' && github.ref == 'refs/heads/master' && github.ref_protected }}
    runs-on: ubuntu-24.04
    environment: image-publish
    permissions:
      contents: read
    steps:
      - name: Checkout protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pinned tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          cache: false
      - name: Validate Windows image inputs
        # Lock file, answer files and guest scripts only. No media is
        # downloaded here and no credential is used.
        run: uv run --locked --script images/windows/repack.py validate
      - name: Mint dispatch-only token
        id: dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.IMAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMAGES_APP_PRIVATE_KEY }}
          owner: GilmanLab
          repositories: agentcompute-images
          permission-contents: write
      - name: Dispatch exact source commit
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          IMAGE: ${{ inputs.image || 'all' }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST repos/GilmanLab/agentcompute-images/dispatches \
            -f event_type=windows-bake \
            -f "client_payload[sha]=$GITHUB_SHA" \
            -f "client_payload[image]=$IMAGE"
          printf 'Dispatched %s (%s) to agentcompute-images/windows.yml. Candidates stay in image-build; stable aliases require fingerprint-bound qualification evidence.\n' \
            "$GITHUB_SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
