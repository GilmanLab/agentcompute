name: Image Publish Dispatch

on:
  push:
    branches: [master]
    paths:
      - images/**
      - '!images/catalog.yaml'
      - '!images/README.md'
      - '!images/windows/**'
      - cmd/image-publish/**
      - .github/workflows/images-publish.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-publish-dispatch
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'GilmanLab/agentcompute' && github.ref == 'refs/heads/master' && github.ref_protected }}
    runs-on: ubuntu-24.04
    environment: image-publish
    permissions:
      contents: read
    steps:
      - name: Checkout protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pinned tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.6.14
          cache: false
      - name: Validate image inputs
        run: uv run --locked --script images/build.py validate
      - name: Mint dispatch-only token
        id: dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.IMAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.IMAGES_APP_PRIVATE_KEY }}
          owner: GilmanLab
          repositories: agentcompute-images
          permission-contents: write
      - name: Dispatch exact source commit
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST repos/GilmanLab/agentcompute-images/dispatches \
            -f event_type=images-publish -f "client_payload[sha]=$GITHUB_SHA"
          printf 'Dispatched %s to private agentcompute-images. Acceptance and publication are reported by its bake run and catalog PR.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
